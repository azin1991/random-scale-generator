<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Scale Generator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- abcjs: renders chord notes on a musical staff (local copy) -->
  <script src="abcjs-basic-min.js"></script>

  <style>
    :root {
      --navy: #1a4d6f;
      --navy-hover: #2a6d9f;
      --sky: #d4e9f7;
      --sky-deep: #b8dff0;
      --sky-line: #a8d5e2;
      --sky-soft: #eef7fb;
      --page: #f5fafd;
      --pink: 255, 90, 120;
      --pink-dark: 150, 50, 60;
      --muted: #5c7d93;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--navy);
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 16px 120px;
    }

    /* ─── Header ─── */
    .page-header { margin-bottom: 24px; }
    .page-header h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 34px);
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .page-header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    /* ─── Layout: generator first on mobile, sticky right column on desktop ─── */
    .layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .generator-col { order: -1; }

    @media (min-width: 860px) {
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        align-items: start;
        gap: 32px;
      }
      .generator-col {
        order: 0;
        position: sticky;
        top: 24px;
      }
    }

    /* ─── Settings panels ─── */
    .panel {
      background: white;
      border: 1px solid var(--sky-line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px -14px #7ab5d0;
    }
    .panel-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .panel-head h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
    }
    .panel-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: var(--sky-soft);
      border-radius: 999px;
      padding: 2px 9px;
      font-variant-numeric: tabular-nums;
    }
    .panel-actions {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }
    .panel-actions button {
      background: none;
      border: none;
      color: var(--navy);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0.75;
    }
    .panel-actions button:hover { background: var(--sky-soft); opacity: 1; }

    /* Toggle chips (checkbox hidden, span styled) */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip { position: relative; cursor: pointer; }
    .chip input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .chip span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 7px 14px;
      border: 1px solid var(--sky-line);
      border-radius: 999px;
      background: white;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      transition: background .15s, color .15s, border-color .15s;
      user-select: none;
    }
    .chip span::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid var(--sky-line);
      flex-shrink: 0;
      transition: inherit;
    }
    .chip:hover span { border-color: var(--navy-hover); }
    .chip input:checked + span {
      background: var(--sky);
      border-color: var(--navy);
      color: var(--navy);
    }
    .chip input:checked + span::before {
      background: rgb(var(--pink));
      border-color: rgb(var(--pink));
    }
    .chip input:focus-visible + span {
      outline: 2px solid var(--navy);
      outline-offset: 2px;
    }

    /* Keys: 12-key grid */
    .keys-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (min-width: 520px) {
      .keys-grid { grid-template-columns: repeat(6, 1fr); }
    }
    .keys-grid .chip span {
      width: 100%;
      justify-content: center;
      border-radius: 10px;
      min-height: 44px;
      font-size: 15px;
      font-weight: 700;
    }
    .keys-grid .chip span::before { display: none; }
    .keys-grid .chip input:checked + span {
      background: var(--navy);
      color: white;
    }

    /* ─── Generator card ─── */
    .generator {
      background: white;
      border: 1px solid var(--sky-line);
      border-radius: 18px;
      padding: 28px 20px 24px;
      text-align: center;
      box-shadow: 0 10px 30px -18px #7ab5d0;
    }
    .generator-label {
      margin: 18px 0 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* From Uiverse.io by catraco */
    .btn-class-name {
      --primary: var(--pink);
      --secondary: var(--pink-dark);
      width: 76px;
      height: 64px;
      border: none;
      outline: none;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      outline: 10px solid rgb(var(--primary), .5);
      border-radius: 100%;
      position: relative;
      transition: .3s;
      background: none;
      padding: 0;
    }
    .btn-class-name .back {
      background: rgb(var(--secondary));
      border-radius: 100%;
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
    }
    .btn-class-name .front {
      background: linear-gradient(0deg, rgba(var(--primary), .6) 20%, rgba(var(--primary)) 50%);
      box-shadow: 0 .5em 1em -0.2em rgba(var(--secondary), .5);
      border-radius: 100%;
      position: absolute;
      border: 1px solid rgb(var(--secondary));
      left: 0; top: 0;
      width: 100%; height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 600;
      font-family: inherit;
      transform: translateY(-15%);
      transition: .15s;
      color: rgb(var(--secondary));
    }
    .btn-class-name:active .front {
      transform: translateY(0%);
      box-shadow: 0 0;
    }
    .btn-class-name:focus-visible { outline-color: rgb(var(--primary)); }

    /* Result stack: back cards absolute, front card grows with the text */
    .container {
      margin: 40px auto 0;
      width: 100%;
      max-width: 380px;
      position: relative;
      padding-top: 20px;
    }
    .container > * {
      border: solid 1px var(--sky-line);
      background-color: var(--sky);
      border-radius: 12px;
      color: var(--navy);
      box-shadow: 0px 8px 20px -10px #7ab5d0;
      letter-spacing: 0.5px;
      background-image: radial-gradient(circle 160px at 50% 120%, var(--sky-deep), var(--sky));
    }
    .card1, .card2 {
      position: absolute;
      top: 0;
      bottom: 20px;
    }
    .card1 { left: 20px; right: 20px; }
    .card2 { left: 10px; right: 10px; top: 10px; bottom: 10px; }
    .card3 {
      position: relative;
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 18px;
    }
    #result {
      margin: 0;
      font-size: clamp(17px, 4.6vw, 21px);
      font-weight: 800;
      line-height: 1.35;
    }
    #result.placeholder {
      font-weight: 600;
      color: var(--muted);
      font-size: 15px;
    }
    #result.pop { animation: pop .35s ease-out; }
    @keyframes pop {
      0%   { transform: scale(.94); opacity: .3; }
      100% { transform: scale(1);   opacity: 1; }
    }

    /* Review Button */
    #review-btn {
      display: none;
      margin: 20px auto 0;
      padding: 11px 22px;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 10px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: fit-content;
      transition: background 0.2s;
    }
    #review-btn:hover { background: var(--navy-hover); }

    /* Review Section */
    #review-section {
      display: none;
      margin-top: 16px;
      width: 100%;
      text-align: left;
    }

    .review-card {
      background: var(--sky-soft);
      border: 1px solid var(--sky-line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      color: var(--navy);
    }
    .review-card h4 {
      margin: 0 0 12px 0;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    /* Note circles */
    .notes-display {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .note-pill {
      background: var(--navy);
      color: white;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-shrink: 0;
      line-height: 1.2;
    }

    /* abcjs staff container */
    #chord-staff {
      background: white;
      border-radius: 8px;
      padding: 8px 4px 4px 4px;
      margin-top: 10px;
      overflow: hidden;
    }
    /* Override abcjs default colours to match our theme */
    #chord-staff svg {
      width: 100% !important;
      height: auto !important;
    }
    #chord-staff .abcjs-note { fill: var(--navy); }
    #chord-staff .abcjs-staff { stroke: var(--navy); }

    /* Collapsible how-to */
    .collapsible-header {
      cursor: pointer;
      background: white;
      border: 1px solid var(--sky-line);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .collapsible-header:hover { background: var(--sky-soft); }
    .collapsible-body {
      display: none;
      background: white;
      border: 1px solid var(--sky-line);
      border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 14px;
      font-size: 14px;
      color: var(--navy);
      line-height: 1.7;
    }

    /* Interval chain */
    .interval-node {
      background: var(--navy);
      color: white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      flex-shrink: 0;
      text-align: center;
      line-height: 1.2;
    }

    /* ─── Mobile sticky generate bar (shown when main button is off-screen) ─── */
    .mobile-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(245, 250, 253, .92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid var(--sky-line);
      transform: translateY(110%);
      transition: transform .25s ease;
      z-index: 10;
    }
    .mobile-bar.visible { transform: translateY(0); }
    .mobile-bar button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: rgb(var(--pink));
      color: white;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 0 rgb(var(--pink-dark));
      transition: transform .1s, box-shadow .1s;
    }
    .mobile-bar button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgb(var(--pink-dark));
    }
    @media (min-width: 860px) {
      .mobile-bar { display: none; }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="page-header">
      <h1>Random Scale Generator</h1>
      <p>Pick what you're practising, then press the button for a random exercise.</p>
    </header>

    <div class="layout">

      <!-- SETTINGS -->
      <div class="settings-col">

        <!-- SCALES -->
        <section class="panel" data-category="scale">
          <div class="panel-head">
            <h3>Scales</h3>
            <span class="panel-count"></span>
            <div class="panel-actions">
              <button onclick="toggleCategory('scale', true)">All</button>
              <button onclick="toggleCategory('scale', false)">None</button>
            </div>
          </div>
          <div class="chips">
            <label class="chip"><input type="checkbox" class="scale" value="Major scale" checked><span>Major</span></label>
            <label class="chip"><input type="checkbox" class="scale" value="Minor scale, harmonic form" checked><span>Harmonic Minor</span></label>
            <label class="chip"><input type="checkbox" class="scale" value="Minor scale, melodic form" checked><span>Melodic Minor</span></label>
            <label class="chip"><input type="checkbox" class="scale" value="Chromatic scale – starting on KEY" checked><span>Chromatic</span></label>
            <label class="chip"><input type="checkbox" class="scale" value="Major formula pattern" checked><span>Formula Major</span></label>
            <label class="chip"><input type="checkbox" class="scale" value="Minor formula pattern" checked><span>Formula Minor</span></label>
          </div>
        </section>

        <!-- CHORDS -->
        <section class="panel" data-category="chord">
          <div class="panel-head">
            <h3>Chords</h3>
            <span class="panel-count"></span>
            <div class="panel-actions">
              <button onclick="toggleCategory('chord', true)">All</button>
              <button onclick="toggleCategory('chord', false)">None</button>
            </div>
          </div>
          <div class="chips">
            <label class="chip"><input type="checkbox" class="chord" value="Major four-note chord, solid form" checked><span>Major · solid</span></label>
            <label class="chip"><input type="checkbox" class="chord" value="Major four-note chord, broken form" checked><span>Major · broken</span></label>
            <label class="chip"><input type="checkbox" class="chord" value="Minor four-note chord, solid form" checked><span>Minor · solid</span></label>
            <label class="chip"><input type="checkbox" class="chord" value="Minor four-note chord, broken form" checked><span>Minor · broken</span></label>
            <label class="chip"><input type="checkbox" class="chord" value="Dominant 7th of KEY major, solid form" checked><span>Dominant 7th · solid</span></label>
            <label class="chip"><input type="checkbox" class="chord" value="Dominant 7th of KEY major, broken form" checked><span>Dominant 7th · broken</span></label>
            <label class="chip"><input type="checkbox" class="chord" value="Diminished 7th of KEY minor, solid form" checked><span>Diminished 7th · solid</span></label>
            <label class="chip"><input type="checkbox" class="chord" value="Diminished 7th of KEY minor, broken form" checked><span>Diminished 7th · broken</span></label>
          </div>
        </section>

        <!-- ARPEGGIOS -->
        <section class="panel" data-category="arpeggio">
          <div class="panel-head">
            <h3>Arpeggios</h3>
            <span class="panel-count"></span>
            <div class="panel-actions">
              <button onclick="toggleCategory('arpeggio', true)">All</button>
              <button onclick="toggleCategory('arpeggio', false)">None</button>
            </div>
          </div>
          <div class="chips">
            <label class="chip"><input type="checkbox" class="arpeggio" value="Major arpeggio – root & inversions" checked><span>Major</span></label>
            <label class="chip"><input type="checkbox" class="arpeggio" value="Minor arpeggio – root & inversions" checked><span>Minor</span></label>
            <label class="chip"><input type="checkbox" class="arpeggio" value="Dominant 7th arpeggio of KEY major – root & inversions" checked><span>Dominant 7th</span></label>
            <label class="chip"><input type="checkbox" class="arpeggio" value="Diminished 7th arpeggio of KEY minor – root & inversions" checked><span>Diminished 7th</span></label>
          </div>
        </section>

        <!-- ADVANCED OPTIONS -->
        <section class="panel" data-category="advancedOptions">
          <div class="panel-head">
            <h3>Advanced</h3>
            <span class="panel-count"></span>
            <div class="panel-actions">
              <button onclick="toggleCategory('advancedOptions', true)">All</button>
              <button onclick="toggleCategory('advancedOptions', false)">None</button>
            </div>
          </div>
          <div class="chips">
            <label class="chip"><input type="checkbox" class="advancedOptions" value="Major scale separated by a 3rd"><span>Separated by a 3rd</span></label>
            <label class="chip"><input type="checkbox" class="advancedOptions" value="Major scale separated by a 6th"><span>Separated by a 6th</span></label>
            <label class="chip"><input type="checkbox" class="advancedOptions" value="Major scale in octave"><span>Major in octaves</span></label>
            <label class="chip"><input type="checkbox" class="advancedOptions" value="Minor scale, harmonic form in octave"><span>Harmonic minor in octaves</span></label>
            <label class="chip"><input type="checkbox" class="advancedOptions" value="Minor scale, melodic form in octave"><span>Melodic minor in octaves</span></label>
            <label class="chip"><input type="checkbox" class="advancedOptions" value="Chromatic scale – starting on KEY in octave"><span>Chromatic in octaves</span></label>
          </div>
        </section>

        <!-- KEYS -->
        <section class="panel" data-category="key">
          <div class="panel-head">
            <h3>Keys</h3>
            <span class="panel-count"></span>
            <div class="panel-actions">
              <button onclick="toggleCategory('key', true)">All</button>
              <button onclick="toggleCategory('key', false)">None</button>
            </div>
          </div>
          <div class="keys-grid">
            <label class="chip"><input type="checkbox" class="key" value="C" checked><span>C</span></label>
            <label class="chip"><input type="checkbox" class="key" value="C♯/D♭" checked><span>C♯/D♭</span></label>
            <label class="chip"><input type="checkbox" class="key" value="D" checked><span>D</span></label>
            <label class="chip"><input type="checkbox" class="key" value="E♭" checked><span>E♭</span></label>
            <label class="chip"><input type="checkbox" class="key" value="E" checked><span>E</span></label>
            <label class="chip"><input type="checkbox" class="key" value="F" checked><span>F</span></label>
            <label class="chip"><input type="checkbox" class="key" value="F♯/G♭" checked><span>F♯/G♭</span></label>
            <label class="chip"><input type="checkbox" class="key" value="G" checked><span>G</span></label>
            <label class="chip"><input type="checkbox" class="key" value="A♭" checked><span>A♭</span></label>
            <label class="chip"><input type="checkbox" class="key" value="A" checked><span>A</span></label>
            <label class="chip"><input type="checkbox" class="key" value="B♭" checked><span>B♭</span></label>
            <label class="chip"><input type="checkbox" class="key" value="B" checked><span>B</span></label>
          </div>
        </section>

      </div>

      <!-- GENERATOR -->
      <div class="generator-col">
        <div class="generator">
          <button class="btn-class-name" id="generate-btn" onclick="generateRandom()" aria-label="Generate a random exercise">
            <span class="back"></span>
            <span class="front"></span>
          </button>
          <p class="generator-label">Tap to generate</p>

          <div class="container">
            <div class="card1"></div>
            <div class="card2"></div>
            <div class="card3">
              <p id="result" class="placeholder" aria-live="polite">Your exercise will appear here</p>
            </div>
          </div>

          <!-- REVIEW BUTTON -->
          <button id="review-btn" onclick="toggleReview()">📖 Review the Notes</button>

          <!-- REVIEW SECTION -->
          <div id="review-section">
            <div id="review-content"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- MOBILE STICKY GENERATE BAR -->
  <div class="mobile-bar" id="mobile-bar">
    <button onclick="generateRandom(); document.querySelector('.generator').scrollIntoView({ behavior: 'smooth', block: 'start' });">🎲 Generate</button>
  </div>

  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    let lastKey = '';
    let lastType = '';
    let reviewVisible = false;

    // ─── Enharmonic chord note lookup table ───────────────────────────────────
    // Precomputed correct note spellings for every key × chord type.
    // Rules applied:
    //   Major/minor 4-note chord: root, 3rd, 5th, octave (root repeated)
    //   Dominant 7th: root = 5th degree of major scale; intervals M3 m3 m3
    //   Diminished 7th: root = 7th degree (leading tone) of major scale; intervals m3 m3 m3
    // Enharmonic double-flats (bb) and double-sharps (##) written out explicitly.

    const CHORD_NOTES = {
      // ── Major four-note chord (root, M3, P5) ──
      major4: {
        'C':      ['C',  'E',   'G'],
        'C♯/D♭': ['Db', 'F',   'Ab'],
        'D':      ['D',  'F#',  'A'],
        'E♭':     ['Eb', 'G',   'Bb'],
        'E':      ['E',  'G#',  'B'],
        'F':      ['F',  'A',   'C'],
        'F♯/G♭': ['Gb', 'Bb',  'Db'],
        'G':      ['G',  'B',   'D'],
        'A♭':     ['Ab', 'C',   'Eb'],
        'A':      ['A',  'C#',  'E'],
        'B♭':     ['Bb', 'D',   'F'],
        'B':      ['B',  'D#',  'F#'],
      },
      // ── Minor four-note chord (root, m3, P5) ──
      minor4: {
        'C':      ['C',  'Eb',  'G'],
        'C♯/D♭': ['Db', 'Fb',  'Ab'],  // Fb = E enharmonically
        'D':      ['D',  'F',   'A'],
        'E♭':     ['Eb', 'Gb',  'Bb'],
        'E':      ['E',  'G',   'B'],
        'F':      ['F',  'Ab',  'C'],
        'F♯/G♭': ['Gb', 'Bbb', 'Db'],  // Bbb = A enharmonically
        'G':      ['G',  'Bb',  'D'],
        'A♭':     ['Ab', 'Cb',  'Eb'],
        'A':      ['A',  'C',   'E'],
        'B♭':     ['Bb', 'Db',  'F'],
        'B':      ['B',  'D',   'F#'],
      },
      // ── Dominant 7th chord (root = 5th degree of major scale) ──
      // Intervals from that root: M3 m3 m3
      dom7: {
        'C':      ['G',  'B',   'D',   'F'],   // G dom7
        'C♯/D♭': ['Ab', 'C',   'Eb',  'Gb'],  // Ab dom7
        'D':      ['A',  'C#',  'E',   'G'],   // A dom7
        'E♭':     ['Bb', 'D',   'F',   'Ab'],  // Bb dom7
        'E':      ['B',  'D#',  'F#',  'A'],   // B dom7
        'F':      ['C',  'E',   'G',   'Bb'],  // C dom7
        'F♯/G♭': ['Db', 'F',   'Ab',  'Cb'],  // Db dom7
        'G':      ['D',  'F#',  'A',   'C'],   // D dom7
        'A♭':     ['Eb', 'G',   'Bb',  'Db'],  // Eb dom7
        'A':      ['E',  'G#',  'B',   'D'],   // E dom7
        'B♭':     ['F',  'A',   'C',   'Eb'],  // F dom7
        'B':      ['F#', 'A#',  'C#',  'E'],   // F# dom7
      },
      // ── Diminished 7th chord (root = 7th degree / leading tone of major scale) ──
      // Intervals from that root: m3 m3 m3
      dim7: {
        'C':      ['B',  'D',   'F',   'Ab'],  // B dim7
        'C♯/D♭': ['C',  'Eb',  'Gb',  'Bbb'], // C dim7 (Bbb = A)
        'D':      ['C#', 'E',   'G',   'Bb'],  // C# dim7
        'E♭':     ['D',  'F',   'Ab',  'Cb'],  // D dim7
        'E':      ['D#', 'F#',  'A',   'C'],   // D# dim7
        'F':      ['E',  'G',   'Bb',  'Db'],  // E dim7
        'F♯/G♭': ['F',  'Ab',  'Cb',  'Ebb'], // F dim7 (Ebb = D)
        'G':      ['F#', 'A',   'C',   'Eb'],  // F# dim7
        'A♭':     ['G',  'Bb',  'Db',  'Fb'],  // G dim7 (Fb = E)
        'A':      ['G#', 'B',   'D',   'F'],   // G# dim7
        'B♭':     ['A',  'C',   'Eb',  'Gb'],  // A dim7
        'B':      ['A#', 'C#',  'E',   'G'],   // A# dim7
      },
    };

    // ─── Get chord notes from lookup table ────────────────────────────────────
    function getChordNotes(key, formula) {
      return (CHORD_NOTES[formula] && CHORD_NOTES[formula][key]) || [];
    }

    // ─── Convert note name → abcjs ABC notation with octave placement ─────────
    // abcjs treble clef: C, = C3 (below staff), C = C4 (middle C, ledger line below),
    // D E F G A B = D4-B4, c d e f g a b = C5-B5, c' = C6
    // We assign octave so the chord sits in the middle of the treble staff (D4–G5 range).
    //
    // Strategy: assign each note to the octave that places it closest to middle of staff.
    // Staff centre ≈ B4. We pick the octave that keeps the note in D4–B5 range.
    //
    // Pitch class order (ignoring accidentals): C D E F G A B = 0-6
    const LETTER_PITCH = { C:0, D:1, E:2, F:3, G:4, A:5, B:6 };

    function noteToAbc(note, forceOctave) {
      // Parse accidental and letter
      let acc = '', letter = '';
      if (note.length >= 3 && note[1] === 'b' && note[2] === 'b') {
        acc = '__'; letter = note[0];
      } else if (note.length >= 3 && note[1] === '#' && note[2] === '#') {
        acc = '^^'; letter = note[0];
      } else if (note.length === 2 && note[1] === 'b') {
        acc = '_';  letter = note[0];
      } else if (note.length === 2 && note[1] === '#') {
        acc = '^';  letter = note[0];
      } else {
        letter = note[0];
      }

      // If octave forced externally, use it
      if (forceOctave !== undefined) {
        if (forceOctave === 5) return acc + letter.toLowerCase();
        if (forceOctave === 3) return acc + letter.toUpperCase() + ',';
        return acc + letter.toUpperCase(); // octave 4
      }

      // Auto-place: put note in octave 4 unless it's C or D (too low for treble),
      // in which case use octave 5 so it sits on the staff
      const p = LETTER_PITCH[letter] ?? 0;
      // Treble staff in ABC: D4(=D) E4(=E) F4(=F) G4(=G) A4(=A) B4(=B) sit on/near staff
      // C4(=C) is middle C — one ledger line below, acceptable
      // Use octave 4 for C-B, but for chords that start low (C,D,E as root) we may push up
      return acc + letter.toUpperCase(); // default octave 4
    }

    // ─── Render chord on abcjs staff ──────────────────────────────────────────
    // Place notes intelligently so they stack as a chord in root position on treble staff.
    // Root goes in octave 4; subsequent notes go in the lowest octave above the previous note.
    function renderChordStaff(notes) {
      const LETTERS = ['C','D','E','F','G','A','B'];

      // Get letter index (ignoring accidentals)
      function letterIdx(note) {
        return LETTERS.indexOf(note[0]);
      }

      // Build ABC note tokens with correct octave so notes ascend (root position)
      let abcNotes = [];
      let prevIdx = -1;
      let octave = 4; // start in octave 4

      for (let i = 0; i < notes.length; i++) {
        const note = notes[i];
        const idx = letterIdx(note);

        if (i === 0) {
          // Root: if C or D, use octave 4 (C4 = middle C, one ledger below staff — fine)
          octave = 4;
        } else {
          // Each next note must be above the previous one
          if (idx <= prevIdx) {
            octave += 1; // jump up an octave
          }
        }
        prevIdx = idx;

        // Build ABC token
        let acc = '';
        let letter = note[0];
        if (note.length >= 3 && note[1] === 'b' && note[2] === 'b') acc = '__';
        else if (note.length >= 3 && note[1] === '#' && note[2] === '#') acc = '^^';
        else if (note.length === 2 && note[1] === 'b') acc = '_';
        else if (note.length === 2 && note[1] === '#') acc = '^';

        let token = '';
        if (octave === 3) token = acc + letter.toUpperCase() + ',';
        else if (octave === 4) token = acc + letter.toUpperCase();
        else if (octave === 5) token = acc + letter.toLowerCase();
        else if (octave === 6) token = acc + letter.toLowerCase() + "'";
        else token = acc + letter.toUpperCase();

        abcNotes.push(token);
      }

      const chordAbc = '[' + abcNotes.join('4') + '4]';

      ABCJS.renderAbc('chord-staff', `X:1\nL:1/4\nK:C\n${chordAbc}`, {
        staffwidth: 220,
        scale: 1.5,
        paddingtop: 0,
        paddingbottom: 12,
        paddingleft: 10,
        paddingright: 10,
      });
    }

    // ─── Chord type detectors ─────────────────────────────────────────────────
    function getChordFormula(typeStr) {
      if (typeStr.includes('Diminished 7th')) return 'dim7';
      if (typeStr.includes('Dominant 7th'))   return 'dom7';
      if (typeStr.includes('Major'))          return 'major4';
      if (typeStr.includes('Minor'))          return 'minor4';
      return null;
    }

    function isChordType(typeStr) {
      return typeStr.includes('chord') || typeStr.includes('arpeggio');
    }

    // ─── How-to interval chain ────────────────────────────────────────────────
    function buildChordHowTo(formula, key) {
      const chains = {
        major4: [{label:'Root'},{semi:4},{label:'3rd'},{semi:3},{label:'5th'}],
        minor4: [{label:'Root'},{semi:3},{label:'3rd'},{semi:4},{label:'5th'}],
        dom7:   [{label:'Root'},{semi:4},{label:'3rd'},{semi:3},{label:'5th'},{semi:3},{label:'7th'}],
        dim7:   [{label:'Root'},{semi:3},{label:'3rd'},{semi:3},{label:'5th'},{semi:3},{label:'7th'}],
      };

      const hints = {
        dom7: `<p style="margin:0 0 12px;font-size:13px;color:#555;">The Root is the <strong>5th degree</strong> of the ${key} major scale.</p>`,
        dim7: `<p style="margin:0 0 12px;font-size:13px;color:#555;">The Root is the <strong>7th degree</strong> (leading tone) of the ${key} major scale.</p>`,
      };

      const steps = chains[formula] || [];
      let chain = `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:4px;">`;
      for (const item of steps) {
        if (item.label !== undefined) {
          chain += `<div class="interval-node">${item.label}</div>`;
        } else {
          chain += `<div style="display:flex;flex-direction:column;align-items:center;
                      font-size:10px;color:#b05070;font-weight:bold;gap:1px;min-width:60px;">
            <span>+${item.semi} st</span>
            <span style="font-size:15px;color:#555;line-height:1;">──▶</span>
          </div>`;
        }
      }
      chain += `</div>`;
      return (hints[formula] || '') + chain;
    }

    // ─── Display note name with Unicode accidentals ───────────────────────────
    // Convert internal notation (Bbb, F#, Cb) to display (B𝄫, F♯, C♭)
    function displayNote(note) {
      return note
        .replace(/bb$/, '𝄫')   // double flat
        .replace(/##$/, '𝄪')   // double sharp
        .replace(/b$/, '♭')    // flat
        .replace(/#$/, '♯');   // sharp
    }

    // ─── Main Review Builder ──────────────────────────────────────────────────
    const COMING_SOON = `<div class="review-card" style="text-align:center;padding:20px;color:#888;font-style:italic;">
      ⏳ Data will be available soon
    </div>`;

    function buildReview(key, typeStr) {
      // Scales and advanced options → always coming soon
      if (typeStr.includes('scale') || typeStr.includes('formula') ||
          typeStr.includes('octave') || typeStr.includes('3rd') || typeStr.includes('6th')) {
        return COMING_SOON;
      }

      const formula = getChordFormula(typeStr);
      if (!formula) return COMING_SOON;

      const notes = getChordNotes(key, formula);

      const pillsHtml = `<div class="review-card">
        <h4>Chord Notes</h4>
        <div class="notes-display">
          ${notes.map(n => `<span class="note-pill">${displayNote(n)}</span>`).join('')}
        </div>
        <div id="chord-staff"></div>
      </div>`;

      const howToHtml = `
        <div class="collapsible-header" onclick="toggleCollapsible(this)">
          How to find this chord <span>▼</span>
        </div>
        <div class="collapsible-body">
          ${buildChordHowTo(formula, key)}
        </div>`;

      return pillsHtml + howToHtml;
    }

    // ─── Collapsible toggle ───────────────────────────────────────────────────
    function toggleCollapsible(header) {
      const body = header.nextElementSibling;
      const arrow = header.querySelector('span');
      const open = body.style.display === 'block';
      body.style.display = open ? 'none' : 'block';
      arrow.textContent = open ? '▼' : '▲';
    }

    // ─── Review section toggle ────────────────────────────────────────────────
    function toggleReview() {
      const section = document.getElementById('review-section');
      reviewVisible = !reviewVisible;
      section.style.display = reviewVisible ? 'block' : 'none';
      document.getElementById('review-btn').textContent =
        reviewVisible ? '✖ Hide Notes' : '📖 Review the Notes';

      // Render staff only if the chord-staff div is present (i.e. review has chord content)
      if (reviewVisible) {
        setTimeout(() => {
          const staffDiv = document.getElementById('chord-staff');
          if (staffDiv) {
            const formula = getChordFormula(lastType);
            if (formula) {
              const notes = getChordNotes(lastKey, formula);
              renderChordStaff(notes);
            }
          }
        }, 50);
      }
    }

    // ─── Category toggle ──────────────────────────────────────────────────────
    function toggleCategory(category, select) {
      document.querySelectorAll('.' + category).forEach(cb => cb.checked = select);
      updateCounts();
    }

    // ─── Panel "x/y" counts ───────────────────────────────────────────────────
    function updateCounts() {
      document.querySelectorAll('.panel[data-category]').forEach(panel => {
        const boxes = panel.querySelectorAll('input[type="checkbox"]');
        const checked = [...boxes].filter(cb => cb.checked).length;
        panel.querySelector('.panel-count').textContent = `${checked}/${boxes.length}`;
      });
    }
    document.addEventListener('change', e => {
      if (e.target.matches('.panel input[type="checkbox"]')) updateCounts();
    });
    updateCounts();

    // ─── Result text helper (placeholder style + pop animation) ───────────────
    function setResult(text, isPlaceholder) {
      const el = document.getElementById('result');
      el.textContent = text;
      el.classList.toggle('placeholder', !!isPlaceholder);
      el.classList.remove('pop');
      void el.offsetWidth; // restart animation
      el.classList.add('pop');
    }

    // ─── Mobile sticky bar: show when the main button is off-screen ───────────
    if ('IntersectionObserver' in window) {
      const bar = document.getElementById('mobile-bar');
      new IntersectionObserver(([entry]) => {
        bar.classList.toggle('visible', !entry.isIntersecting);
      }).observe(document.getElementById('generate-btn'));
    }

    // ─── Main Generator ───────────────────────────────────────────────────────
    function generateRandom() {
      const selectedTypes = [...document.querySelectorAll('.scale:checked, .chord:checked, .arpeggio:checked, .advancedOptions:checked')].map(cb => cb.value);
      const selectedKeys  = [...document.querySelectorAll('.key:checked')].map(cb => cb.value);

      if (selectedTypes.length === 0 || selectedKeys.length === 0) {
        setResult('⚠️ Please select at least one key and one requirement.', true);
        document.getElementById('review-btn').style.display = 'none';
        document.getElementById('review-section').style.display = 'none';
        return;
      }

      const type = selectedTypes[Math.floor(Math.random() * selectedTypes.length)];
      const key  = selectedKeys[Math.floor(Math.random() * selectedKeys.length)];

      let result = type.replace('KEY', key);
      if (!type.includes('KEY')) result = key + ' ' + result;

      setResult(result, false);

      lastKey  = key;
      lastType = type;
      reviewVisible = false;

      document.getElementById('review-section').style.display = 'none';
      document.getElementById('review-content').innerHTML = buildReview(key, type);
      document.getElementById('review-btn').style.display = 'inline-block';
      document.getElementById('review-btn').textContent = '📖 Review the Notes';
    }
  </script>
</body>
</html>
